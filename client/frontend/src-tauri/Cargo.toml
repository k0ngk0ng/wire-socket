[package]
name = "wire-socket"
version = "0.10.3"
description = "Cross-platform VPN client with WireGuard over WebSocket tunneling"
authors = ["chenj"]
license = "MIT"
repository = "https://github.com/k0ngk0ng/wire-socket"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "wire_socket_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
url = "2.5"
urlencoding = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
